name: Process Public Samples

on:
  workflow_dispatch:
    inputs:
      repo-name:
        description: 'publicsamples repo name'
        required: true
      lib-id:
        description: 'Library ID'
        required: true
      opus-repo:
        description: 'Opus repo name'
        required: true
      categories:
        description: 'Categories (comma-separated, or all)'
        required: false
        default: 'all'

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip3 install --break-system-packages requests pynacl
      
      - name: Disk space
        run: df -h /
      
      - name: Process
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO_NAME: ${{ inputs.repo-name }}
          LIB_ID: ${{ inputs.lib-id }}
          OPUS_REPO: ${{ inputs.opus-repo }}
          CATEGORIES: ${{ inputs.categories }}
        run: |
          python3 scripts/process-samples.py \
            --repo-name "$REPO_NAME" \
            --lib-id "$LIB_ID" \
            --opus-repo "$OPUS_REPO" \
            --categories "$CATEGORIES"
